[package]
name = "wassup"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_9"] }
async-channel = "2.5.0"
gettext-rs = { version = "0.8.0", features = ["gettext-system"] }
glib = { version = "0.22.10", features = ["v2_72"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_22"] }
libwebp-sys = { version = "0.14.4", default-features = false, features = ["system-dylib", "std"] }
prost = "0.14.4"
qrcodegen = "1.8.0"

[build-dependencies]
prost-build = "0.14.4"
