syntax = "proto3";

package wassup.ipc.v1;

option go_package = "github.com/MawCeron/Wassup/daemon/ipc";

// Every frame on the socket is one of these two messages.

// UI -> daemon.
message Request {
  // Echoed in the matching Event so the UI can pair them. Never 0.
  uint64 id = 1;
  oneof kind {
    ListAccounts list_accounts = 2;
    ListChats list_chats = 3;
    ListMessages list_messages = 4;
    SendText send_text = 5;
    LinkAccount link_account = 6;
    MarkRead mark_read = 7;
    SetActiveChat set_active_chat = 8;
    DownloadMedia download_media = 9;
    SendMedia send_media = 10;
    FetchAvatar fetch_avatar = 11;
    ListStickers list_stickers = 12;
    SendSticker send_sticker = 13;
    UnlockChats unlock_chats = 14;
    GetSettings get_settings = 15;
    SetSettings set_settings = 16;
    Quit quit = 17;
    SearchMessages search_messages = 18;
    React react = 19;
    LoadOlder load_older = 20;
    SetFavoriteSticker set_favorite_sticker = 21;
  }
}

// Daemon -> UI. Either the reply to a Request or a pushed update.
message Event {
  // Id of the Request this answers; 0 for unsolicited updates.
  uint64 request_id = 1;
  oneof kind {
    Error error = 2;
    AccountList accounts = 3;
    ChatList chats = 4;
    MessageList messages = 5;
    Account account_changed = 6;
    Chat chat_changed = 7;
    Message message_received = 8;
    QrCode qr_code = 9;
    LinkFailed link_failed = 10;
    MessageStatusChanged message_status_changed = 11;
    Ack ack = 12;
    MediaReady media_ready = 13;
    StickerList stickers = 14;
    MessagesExpired messages_expired = 15;
    Settings settings = 16;
    ReactionsChanged reactions_changed = 17;
    HistoryAdded history_added = 18;
  }
}

message ListAccounts {}

message ListChats {
  string account_id = 1;
}

// Newest first. Pages backwards from before_id; empty means latest.
message ListMessages {
  string account_id = 1;
  string chat_jid = 2;
  string before_id = 3;
  uint32 limit = 4;
  // Instead of a page: every message from this one to the newest, at most
  // 2000, to show a search result in place.
  string from_id = 5;
}

// Messages of a chat whose text contains query, ignoring case and accents,
// newest first, at most 50. Answered with messages.
message SearchMessages {
  string account_id = 1;
  string chat_jid = 2;
  string query = 3;
}

// Answered with message_received carrying the stored message, or error.
// With link previews on, the daemon first fetches the linked page; texts
// still go out in the order they were sent.
message SendText {
  string account_id = 1;
  string chat_jid = 2;
  string text = 3;
  // Message of the chat this one replies to, quoting it; empty for none.
  string reply_to_id = 4;
}

// Starts QR linking for an unlinked account. Answered with account_changed
// (CONNECTING) or error; then qr_code events follow until account_changed
// (CONNECTED) or link_failed.
message LinkAccount {
  string account_id = 1;
}

// Text to render as a QR code. Replaced by a new one after timeout_ms.
message QrCode {
  string account_id = 1;
  string code = 2;
  uint32 timeout_ms = 3;
}

message LinkFailed {
  string account_id = 1;
  string reason = 2;
}

// Clears a chat's unread count and sends read receipts. Answered with
// chat_changed or error.
message MarkRead {
  string account_id = 1;
  string chat_jid = 2;
}

// The chat the user is looking at in this UI, if any. The daemon does not
// notify about it. Empty fields mean none. Answered with ack.
message SetActiveChat {
  string account_id = 1;
  string chat_jid = 2;
}

// Reply to requests that have nothing else to return.
message Ack {}

message Error {
  string message = 1;
}

message AccountList {
  repeated Account accounts = 1;
}

message ChatList {
  repeated Chat chats = 1;
}

message MessageList {
  repeated Message messages = 1;
}

enum ConnectionState {
  CONNECTION_STATE_UNSPECIFIED = 0;
  CONNECTION_STATE_DISCONNECTED = 1;
  CONNECTION_STATE_CONNECTING = 2;
  CONNECTION_STATE_CONNECTED = 3;
  CONNECTION_STATE_LOGGED_OUT = 4;
}

message Account {
  string id = 1;
  string jid = 2;
  string push_name = 3;
  ConnectionState state = 4;
}

message Chat {
  string account_id = 1;
  string jid = 2;
  string name = 3;
  bool is_group = 4;
  uint32 unread_count = 5;
  int64 last_message_at_ms = 6;
  // Profile or group picture in the daemon's cache; empty when there is
  // none or it has not been fetched yet.
  string avatar_path = 7;
  // Locked on the phone: the UI keeps it out of sight until unlocked, and
  // its notifications carry no sender or preview.
  bool locked = 8;
  // The newest message, as the chat list previews it: its text, or what
  // kind of media it is. Empty when the chat has no messages.
  string last_message = 9;
  bool last_from_me = 10;
  MessageStatus last_status = 11;
  // Who wrote it, in groups; empty for own messages or when unknown.
  string last_sender_name = 12;
}

message Message {
  string account_id = 1;
  string chat_jid = 2;
  string id = 3;
  string sender_jid = 4;
  bool from_me = 5;
  int64 timestamp_ms = 6;
  // Plain text, or a bracketed placeholder such as "[Sticker]" for content
  // the client cannot show yet.
  string text = 7;
  // Display name of the sender; empty for own messages or when unknown.
  string sender_name = 8;
  // Delivery progress of own messages; unspecified for received ones.
  MessageStatus status = 9;
  // Attached image, sticker, document or audio; text is then its caption,
  // possibly empty.
  Media media = 10;
  // The message this one replies to, if any.
  Quote quote = 11;
  // Preview of the first link in the text, if the sender attached one.
  LinkPreview link = 12;
  // Emoji reactions, grouped, most used first.
  repeated Reaction reactions = 13;
}

message Reaction {
  string emoji = 1;
  // How many people reacted with it.
  uint32 count = 2;
  // The user is one of them.
  bool mine = 3;
}

// Asks the phone for the messages before the oldest one stored for a chat,
// when the user scrolls past it. Answered with ack; history_added follows
// if the phone, which must be online, sends any.
message LoadOlder {
  string account_id = 1;
  string chat_jid = 2;
}

// Chats that got messages from the phone's history, after linking or
// asked for with LoadOlder. Their lists and pages may have grown.
message HistoryAdded {
  string account_id = 1;
  repeated string chat_jids = 2;
}

// Sends the user's reaction to a message; an empty emoji takes it back.
// Answered with reactions_changed, which also goes to every other UI.
message React {
  string account_id = 1;
  string chat_jid = 2;
  string message_id = 3;
  string emoji = 4;
}

// A message's reactions after someone reacted or took a reaction back.
message ReactionsChanged {
  string account_id = 1;
  string chat_jid = 2;
  string message_id = 3;
  repeated Reaction reactions = 4;
}

// What a link looks like, as the sender's phone or Wassup fetched it.
message LinkPreview {
  string url = 1;
  string title = 2;
  string description = 3;
  // Small image in the daemon's cache; empty when there is none.
  string thumbnail_path = 4;
}

// What a reply shows of the message it quotes.
message Quote {
  string message_id = 1;
  string sender_jid = 2;
  // Display name of the quoted sender; empty when unknown or own.
  string sender_name = 3;
  // The quoted text, or a label such as "Photo" for media.
  string text = 4;
  // The quoted message was the user's own.
  bool from_me = 5;
  // Small image of a quoted photo, video, sticker or document, in the
  // daemon's cache; empty when it has none.
  string thumbnail_path = 6;
  // The same image as the reply carries it. Only kept in the daemon's
  // database, never sent to the UI.
  bytes thumbnail = 7;
}

enum MediaKind {
  MEDIA_KIND_UNSPECIFIED = 0;
  MEDIA_KIND_IMAGE = 1;
  MEDIA_KIND_STICKER = 2;
  MEDIA_KIND_DOCUMENT = 3;
  MEDIA_KIND_AUDIO = 4;
  MEDIA_KIND_VIDEO = 5;
}

message Media {
  MediaKind kind = 1;
  // Local file in the daemon's cache; empty until downloaded. Media never
  // travels over the socket, only this path.
  string path = 2;
  // Pixel size as announced by the sender, to reserve space before download.
  uint32 width = 3;
  uint32 height = 4;
  // Name the sender gave a document.
  string file_name = 5;
  // In bytes.
  uint64 size = 6;
  // Length of audio.
  uint32 duration_seconds = 7;
  // Audio recorded in the chat, rather than an audio file.
  bool voice_note = 8;
  // Small preview image of a video, cached from the message itself, so it
  // shows before the video is downloaded. Empty when the sender sent none.
  string thumbnail_path = 9;
  // A sticker that is one of the account's favorites.
  bool favorite = 10;
}

// Sends a local file chosen by the user: JPEG and PNG as a photo, MP4 as a
// video, anything else as a document. The reply, message_received with the stored message
// or error, comes once the upload ends; other requests are answered
// meanwhile.
message SendMedia {
  string account_id = 1;
  string chat_jid = 2;
  string path = 3;
  string caption = 4;
  // Send a 512x512 WebP file as a sticker instead.
  bool as_sticker = 5;
  // Send as a document whatever the file is, so photos and videos keep
  // their full quality.
  bool as_document = 6;
  // Send an Ogg Opus recording as a voice note.
  bool voice_note = 7;
}

// The user's favorite stickers, synced from the phone, then the stickers
// they sent most recently in any chat, newest first, without repeats.
// Answered with stickers.
message ListStickers {
  string account_id = 1;
}

message StickerList {
  repeated Sticker stickers = 1;
}

// A sticker known from a message. The message identifies it for download
// and for sending it again.
message Sticker {
  string chat_jid = 1;
  string message_id = 2;
  // Cached file; empty until downloaded like any other media.
  string path = 3;
  // Set for favorites, which come from the phone rather than a message;
  // chat_jid and message_id are then empty.
  string favorite_id = 4;
}

// Sends a known sticker again, reusing the uploaded file. Answered with
// message_received, or error.
message SendSticker {
  string account_id = 1;
  string chat_jid = 2;
  string source_chat_jid = 3;
  string source_message_id = 4;
  // Sends a favorite instead of a sticker from a message.
  string favorite_id = 5;
}

// Adds the sticker of a message to the account's favorites, or removes it,
// on the phone too. Answered with ack, or error.
message SetFavoriteSticker {
  string account_id = 1;
  string chat_jid = 2;
  string message_id = 3;
  bool favorite = 4;
}

// Checks the secret code set on the phone for locked chats. Answered with
// ack if it matches, error otherwise. The code is verified against the
// phone's salted hash; neither leaves the daemon.
message UnlockChats {
  string account_id = 1;
  string secret_code = 2;
}

// Stops the daemon, and with it notifications, until the UI starts it
// again through socket activation. Answered with ack.
message Quit {}

// The user's preferences, stored in config.json. Answered with settings.
message GetSettings {}

// Saves and applies preferences. Answered with settings, or error if a
// value is out of range.
message SetSettings {
  Settings settings = 1;
}

message Settings {
  // Notifications say who wrote but not what.
  bool hide_notification_content = 1;
  // Size of the media cache.
  uint32 media_cache_mb = 2;
  // Read by the UI at startup: draw with the GPU instead of in software.
  bool gpu_rendering = 3;
  // Language code such as "es" or "pt_BR"; empty follows the system. The
  // daemon switches at once, the UI at its next start.
  string language = 4;
  // Show the unread count as a status icon, where the desktop has a tray.
  bool tray_icon = 5;
  // Fetch a preview of the first link in messages the user sends.
  bool link_previews = 6;
  // Read by the UI: "" for the doodles, "plain", or "picture" for the
  // user's own, which the UI keeps in its data directory.
  string chat_background = 7;
}

// Fetches a chat's profile or group picture into the cache. Answered with
// ack; if a picture is found, chat_changed follows with its avatar_path.
message FetchAvatar {
  string account_id = 1;
  string chat_jid = 2;
}

// Fetches a message's media into the cache. Answered with ack at once;
// media_ready follows when the download ends.
message DownloadMedia {
  string account_id = 1;
  string chat_jid = 2;
  string message_id = 3;
}

// Sent to every UI when a download ends: path on success, error otherwise.
message MediaReady {
  string account_id = 1;
  string chat_jid = 2;
  string message_id = 3;
  string path = 4;
  string error = 5;
}

enum MessageStatus {
  MESSAGE_STATUS_UNSPECIFIED = 0;
  MESSAGE_STATUS_SENT = 1;
  MESSAGE_STATUS_DELIVERED = 2;
  MESSAGE_STATUS_READ = 3;
}

// Messages of a chat with disappearing messages whose time ran out. The
// daemon has already deleted them and their media.
message MessagesExpired {
  string account_id = 1;
  string chat_jid = 2;
  repeated string message_ids = 3;
}

// Own messages that moved forward to a new status.
message MessageStatusChanged {
  string account_id = 1;
  string chat_jid = 2;
  repeated string message_ids = 3;
  MessageStatus status = 4;
}
